# Cek otomatis setiap push/PR: sintaks JavaScript + (untuk tag v*) versi tag harus sama dengan package.json.
name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cek sintaks JS
        run: find www scripts -name '*.js' -o -name '*.mjs' | grep -v vendor | xargs -n1 node --check
      - name: Versi tag = versi package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} tidak sama dengan package.json ($V)"; exit 1; }
