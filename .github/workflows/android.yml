name: Build Android (APK + AAB)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project (Capacitor)
        run: |
          if [ -d android ]; then
            npm run vendor && node scripts/patch-android.mjs && npx cap sync android
          else
            npm run setup:android
          fi

      - name: Decode keystore (jika secret tersedia)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build debug APK (selalu, bisa langsung diinstal untuk tes)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK + AAB (ditandatangani)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Kumpulkan hasil
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/WMS-FG-debug.apk
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp android/app/build/outputs/apk/release/*.apk out/WMS-FG-release.apk
            cp android/app/build/outputs/bundle/release/*.aab out/WMS-FG-release.aab
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: out/*

      - name: Lampirkan ke GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
